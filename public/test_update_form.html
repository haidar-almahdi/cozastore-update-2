<!DOCTYPE html>
<html>
<head>
    <title>Test Product Update Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; margin-top: 5px; }
        .success { color: green; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Test Product Update Form</h1>
    <p>This is a simple test form to debug product update issues.</p>

    <form id="testForm" method="POST" action="/admin/products/1" enctype="multipart/form-data">
        <input type="hidden" name="_token" value="test-token">
        <input type="hidden" name="_method" value="PUT">

        <div class="form-group">
            <label>Product Name:</label>
            <input type="text" name="name" value="Test Product" required>
        </div>

        <div class="form-group">
            <label>Description:</label>
            <textarea name="description" rows="3">Test description</textarea>
        </div>

        <div class="form-group">
            <label>Price:</label>
            <input type="number" name="price" value="29.99" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Stock:</label>
            <input type="number" name="stock" value="10" required>
        </div>

        <div class="form-group">
            <label>Category:</label>
            <select name="category_id" required>
                <option value="1">Women's Fashion</option>
                <option value="2">Men's Fashion</option>
                <option value="3">Accessories</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sizes:</label>
            <input type="checkbox" name="sizes[]" value="S" checked> S
            <input type="checkbox" name="sizes[]" value="M" checked> M
            <input type="checkbox" name="sizes[]" value="L" checked> L
        </div>

        <div class="form-group">
            <label>Colors:</label>
            <input type="text" name="colors[]" value="Red" placeholder="Color name">
            <input type="color" name="color_codes[]" value="#ff0000">
        </div>

        <div class="form-group">
            <label>Status:</label>
            <select name="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <button type="submit">Update Product</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const result = document.getElementById('result');

            result.innerHTML = '<p>Sending request...</p>';

            // Log form data
            console.log('Form data:');
            for (let [key, value] of formData.entries()) {
                console.log(key + ': ' + value);
            }

            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                console.log('Response status:', response.status);
                return response.text();
            })
            .then(data => {
                console.log('Response data:', data);
                result.innerHTML = '<div class="success">Response received. Check console for details.</div>';
            })
            .catch(error => {
                console.error('Error:', error);
                result.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
            });
        });
    </script>
</body>
</html>

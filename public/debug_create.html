<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Create Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .additional-image-item {
            position: relative;
            margin-bottom: 15px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }
        .additional-image-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .remove-image {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h2>Debug: Multiple Images Upload</h2>

        <form method="POST" enctype="multipart/form-data">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0"><i class="fa fa-images"></i> Additional Images</h5>
                    <span class="badge badge-info" id="imageCount">0/8 images</span>
                </div>
                <div class="card-body">
                    <!-- Upload Method -->
                    <div class="form-group">
                        <label class="font-weight-bold">Upload Additional Images</label>
                        <input type="file"
                               name="additional_images[]"
                               class="form-control-file"
                               accept="image/*"
                               multiple
                               onchange="previewAdditionalImages(this)"
                               id="additionalImagesInput">
                        <small class="text-muted">Hold Ctrl/Cmd to select multiple images (Max: 8 images)</small>
                    </div>

                    <!-- Images Preview -->
                    <div id="additional-images-preview" class="row mt-3"></div>

                    <!-- Debug Info -->
                    <div class="mt-3">
                        <h6>Debug Info:</h6>
                        <div id="debugInfo" class="alert alert-info"></div>
                    </div>
                </div>
            </div>

            <button type="button" class="btn btn-primary mt-3" onclick="showFormData()">Show Form Data</button>
        </form>
    </div>

    <script>
        // Debug function
        function updateDebugInfo(message) {
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.innerHTML += message + '<br>';
            console.log(message);
        }

        // Additional images preview
        function previewAdditionalImages(input) {
            updateDebugInfo('previewAdditionalImages called with: ' + input.files.length + ' files');

            const preview = document.getElementById('additional-images-preview');
            const counter = document.getElementById('imageCount');

            if (!preview) {
                updateDebugInfo('ERROR: Preview container not found!');
                return;
            }

            preview.innerHTML = '';

            if (input.files && input.files.length > 0) {
                // Limit to 8 images
                const files = Array.from(input.files).slice(0, 8);

                // Update counter
                counter.textContent = `${files.length}/8 images`;
                updateDebugInfo('Processing ' + files.length + ' files');

                files.forEach((file, index) => {
                    updateDebugInfo('Processing file: ' + file.name + ' Size: ' + file.size + ' Type: ' + file.type);

                    // Validate file type
                    if (!file.type.startsWith('image/')) {
                        alert(`File ${file.name} is not a valid image.`);
                        return;
                    }

                    // Validate file size (2MB)
                    if (file.size > 2 * 1024 * 1024) {
                        alert(`File ${file.name} is too large. Maximum size is 2MB.`);
                        return;
                    }

                    const reader = new FileReader();

                    reader.onload = function(e) {
                        updateDebugInfo('File reader loaded for: ' + file.name);

                        const col = document.createElement('div');
                        col.className = 'col-6 col-md-4 mb-3';
                        col.innerHTML = `
                            <div class="additional-image-item">
                                <img src="${e.target.result}" alt="Additional Image ${index + 1}">
                                <button type="button" class="remove-image" onclick="removeImagePreview(this, ${index})">
                                    <i class="fa fa-times"></i>
                                </button>
                            </div>
                        `;
                        preview.appendChild(col);
                        updateDebugInfo('Added preview for: ' + file.name);
                    }

                    reader.readAsDataURL(file);
                });

                if (files.length >= 8) {
                    alert('Maximum 8 additional images allowed.');
                }
            } else {
                counter.textContent = '0/8 images';
                updateDebugInfo('No files selected');
            }
        }

        // Remove image from preview
        function removeImagePreview(button, index) {
            updateDebugInfo('Removing image at index: ' + index);

            const input = document.getElementById('additionalImagesInput');
            const dt = new DataTransfer();

            // Add all files except the one being removed
            Array.from(input.files).forEach((file, i) => {
                if (i !== index) {
                    dt.items.add(file);
                }
            });

            // Update input files
            input.files = dt.files;

            // Refresh preview
            previewAdditionalImages(input);
        }

        function showFormData() {
            const input = document.getElementById('additionalImagesInput');
            let info = 'Form Data:\\n';
            info += 'Files count: ' + input.files.length + '\\n\\n';

            Array.from(input.files).forEach((file, index) => {
                info += `File ${index + 1}: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)\\n`;
            });

            alert(info);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            updateDebugInfo('Page loaded');

            const fileInput = document.getElementById('additionalImagesInput');
            if (fileInput) {
                updateDebugInfo('File input found. Multiple: ' + fileInput.multiple);
                updateDebugInfo('Accept: ' + fileInput.accept);

                // Add event listener for debugging
                fileInput.addEventListener('change', function(e) {
                    updateDebugInfo('File input changed. Files count: ' + e.target.files.length);
                    if (e.target.files.length > 0) {
                        updateDebugInfo('Files: ' + Array.from(e.target.files).map(f => f.name).join(', '));
                    }
                });
            } else {
                updateDebugInfo('ERROR: File input not found!');
            }
        });
    </script>
</body>
</html>
